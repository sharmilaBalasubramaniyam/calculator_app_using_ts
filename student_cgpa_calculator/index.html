<!DOCTYPE html>
<html>
    <head>
        <title>
            Student CGPA Calculator
        </title>
    </head>

    <h1>Student CGPA Calculator</h1>

    <input type="text" id="Name" placeholder="Enter your Name please">
    <br><br>

    <input type="number" id="Age" placeholder="Enter your Age please">
    <br><br>

    <input type="text" id="College Name" placeholder="Enter your College Name please">
    <br><br>

    <input type="text" id="Degree" placeholder="Enter your degree please">
    <br><br>

    <input type="text" id="Specialization" placeholder="Enter your specialization in College">
    <br><br>

    <input type="number" id="Year" placeholder="Enter your Current Year">
    <br><br>

    <input type="number" id="Current Semester" placeholder="Semester">
    <br><br>

    <select id="semester">
        <option value="">Select Semester</option>
    </select>


    <button onclick="showDetails()">Continue</button>

    <h2> id="result"</h2>

    <script src="app.js"></script>
    </body>

</html>
